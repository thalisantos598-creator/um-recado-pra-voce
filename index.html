<!doctype html><html lang="pt-BR"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#020309"><title>um recado pra você 💙</title><style>*{box-sizing:border-box}body{margin:0;background:#020309;color:#c8f3ff;font-family:Arial;overflow:hidden}main{position:relative;width:100vw;height:100svh;cursor:pointer}canvas{position:absolute;width:100%;height:100%;inset:0}.recado{position:absolute;top:44%;left:50%;transform:translate(-50%,-50%);width:52%;max-width:550px;text-align:center;pointer-events:none}h1{font:400 clamp(29px,4.5vw,62px)/1.12 Georgia,serif;margin:0;text-shadow:0 0 20px #168fff}h1 span{display:block;font-size:.65em;margin-top:12px}p{font-size:clamp(12px,1.8vw,22px);line-height:1.5;color:#8acbea;margin:16px auto 0;max-width:320px}main:focus-visible{outline:2px solid #8acbea;outline-offset:-8px}</style><main role="button" tabindex="0" aria-label="Toque no coração para abrir o recado"><canvas></canvas><div class="recado"><h1>bom dia<br>lindo<span>💙</span></h1><p id="msg" aria-live="polite">toca no coração</p></div></main><script>const c=document.querySelector('canvas'),g=c.getContext('2d'),m=document.querySelector('main'),p=document.querySelector('#msg'),pts=[],reduced=matchMedia('(prefers-reduced-motion: reduce)').matches;let w,h;function size(){w=innerWidth;h=m.clientHeight;let d=Math.min(devicePixelRatio||1,2);c.width=w*d;c.height=h*d;g.setTransform(d,0,0,d,0,0);if(reduced)draw(0)}for(let r of [1,.88])for(let i=0;i<68;i++){let a=i*Math.PI/34;pts.push([16*Math.sin(a)**3*r,-(13*Math.cos(a)-5*Math.cos(2*a)-2*Math.cos(3*a)-Math.cos(4*a))*r,i*.9])}function draw(t){g.clearRect(0,0,w,h);let s=Math.min(w/37,h/34),b=1+.025*Math.sin(t/220);g.textAlign='center';g.font=Math.max(9,s*.65)+'px Arial';for(let [x,y,f]of pts){g.globalAlpha=.5+.5*(1+Math.sin(t/600+f))/2;g.shadowBlur=14;g.shadowColor='#168fff';g.fillStyle='#83dfff';g.fillText('bom dia lindo',w/2+x*s*b,h*.44+y*s*b+Math.sin(t/700+f)*2)}g.globalAlpha=1;if(!reduced)requestAnimationFrame(draw)}size();onresize=size;if(!reduced)requestAnimationFrame(draw);function open(){p.textContent='um beijinho pra começar o teu dia 😘'}m.onclick=open;m.onkeydown=e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();open()}};</script></html>
