<!doctype html><html lang="pt-BR"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>um recado pra você 💙</title><style>body{margin:0;background:#020309;color:#bcecff;text-align:center;font-family:Arial}main{max-width:650px;margin:auto}canvas{width:100%;display:block;cursor:pointer}h1{font-size:28px;font-weight:400;text-shadow:0 0 20px #168fff;margin:0}p{color:#74a4bf;font-size:14px}</style><main><canvas width="650" height="650" role="button" tabindex="0" aria-label="Toque no coração"></canvas><h1>bom dia lindo 💙</h1><p id="msg">toca no coração</p></main><script>const c=document.querySelector('canvas'),g=c.getContext('2d'),p=document.querySelector('#msg'),pts=[];for(let r of [1,.87,.73])for(let i=0;i<48;i++){let a=i*Math.PI/24;pts.push([16*Math.sin(a)**3*r,-(13*Math.cos(a)-5*Math.cos(2*a)-2*Math.cos(3*a)-Math.cos(4*a))*r,i*.7])}function draw(t){g.clearRect(0,0,650,650);let b=1+.045*Math.sin(t/230);g.textAlign='center';g.font='12px Arial';for(let [x,y,f]of pts){g.globalAlpha=.45+.55*(1+Math.sin(t/550+f))/2;g.shadowBlur=12;g.shadowColor='#168fff';g.fillStyle='#83dfff';g.fillText('bom dia lindo',325+x*16*b,300+y*16*b+Math.sin(t/700+f)*2)}g.globalAlpha=1;if(!matchMedia('(prefers-reduced-motion: reduce)').matches)requestAnimationFrame(draw)}requestAnimationFrame(draw);function open(){p.textContent='um beijinho pra começar o teu dia 😘'}c.onclick=open;c.onkeydown=e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();open()}};</script></html>
